name: Release Markata

# Explicit-only publishing during the Python -> markata-py repository
# handoff. Never publish to the historical PyPI "markata" name just because
# package metadata or repository links change.
on:
  workflow_dispatch:

env:
  HATCH_INDEX_USER: __token__
  HATCH_INDEX_AUTH: ${{ secrets.pypi_password }}

jobs:
  release-markata:
    # Require the dedicated Python repository before manual legacy releases.
    if: github.repository == 'WaylonWalker/markata-py'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: waylonwalker/hatch-action@v3
        with:
          before-command: "lint-format"
        env:
          # required for gh release
          GH_TOKEN: ${{ github.token }}
